<head>
  <style>
    body { margin: 0; }
    #chart { width: 100%; height: 100vh; }
  </style>

  <script src="//unpkg.com/globe.gl"></script>
</head>

<body>
  <div id="chart"></div>

  <script type="module">
    // Create the globe instance
    const world = new Globe(document.getElementById('chart'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .pointOfView({ altitude: 3.5 })
      .animate(true); // This will make the globe rotate automatically

    // Optional: You can adjust rotation speed or other properties if needed
    world.controls().auto-rotate = true; // Enables auto-rotation
  </script>
</body>
